services:
  # ─── Graph Database (Knowledge Graph) ──────────────────────
  neo4j:
    image: neo4j:5.20-community
    container_name: faqih-neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/faqih_neo4j_2024
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Vector Database (Semantic Search) ─────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: faqih-qdrant
    ports:
      - "8333:6333"   # REST API
      - "8334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Search Engine (BM25 / Keyword Search) ─────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: faqih-elasticsearch
    ports:
      - "19200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=faqih-cluster
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Cache & Conversation Memory ───────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: faqih-redis
    ports:
      - "16379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Relational Database (Sessions & Metadata) ─────────────
  postgres:
    image: postgres:16-alpine
    container_name: faqih-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: faqih
      POSTGRES_USER: faqih
      POSTGRES_PASSWORD: faqih_pg_2024
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faqih -d faqih"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  es_data:
  redis_data:
  pg_data:
