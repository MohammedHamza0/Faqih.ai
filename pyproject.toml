[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faqih-ai"
version = "0.1.0"
description = "Al-Ijtihad — Islamic Fiqh Hybrid RAG System with Knowledge Graphs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Mohammed Hamza" },
]

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    # Document Processing
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    # Arabic NLP
    "camel-tools>=1.5.0",
    # Embeddings
    "sentence-transformers>=3.0.0",
    # Vector Database
    "qdrant-client>=1.11.0",
    # Graph Database
    "neo4j>=5.20.0",
    # Search Engine
    "elasticsearch[async]>=8.15.0",
    # Cache & Message Broker
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",
    # LLM Clients
    "google-generativeai>=0.8.0",
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    # Data Validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Database
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    # Utilities
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
faqih-ingest = "faqih.ingestion.pipeline:cli"
faqih-healthcheck = "scripts.healthcheck:main"

[tool.hatch.build.targets.wheel]
packages = ["src/faqih"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
